# Monthly data refresh: runs the pipeline against fresh downloads, checks the
# output is plausible, and force-pushes the packed data files (see
# extension/pack.mjs) as the single commit of the data-release branch. The
# extension's background worker reads release.json from that branch and
# downloads whatever changed (extension/src/background.ts).
name: Data release

on:
  schedule:
    - cron: '0 4 3 * *' # 04:00 UTC on the 3rd of each month
  workflow_dispatch:
  # Also whenever what produces or packs the data changes, so a pipeline fix
  # reaches users without waiting for the next month.
  push:
    branches: [master]
    paths:
      - 'pipeline/**'
      - 'extension/pack.mjs'
      - '.github/workflows/data-release.yml'

permissions:
  contents: write

concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pipeline/go.mod
          cache-dependency-path: pipeline/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run pipeline
        working-directory: pipeline
        run: make data

      # A source that silently shrank (a renamed column, an empty year) must
      # not reach users: refuse output well below the current coverage.
      - name: Check output
        working-directory: data
        run: |
          node -e '
            const min = { "grid.json": 1000, "madrid/grid.json": 5000 };
            for (const [f, n] of Object.entries(min)) {
              const got = Object.keys(require("./" + f).cells).length;
              if (got < n) throw new Error(`${f}: ${got} cells, expected at least ${n}`);
            }
            const shards = require("./spain/index.json").shards.length;
            if (shards < 70) throw new Error(`spain: ${shards} shards, expected at least 70`);
          '

      - name: Pack
        run: node extension/pack.mjs data release

      - name: Publish to data-release branch
        working-directory: release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data-release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "data $(node -p 'require("./release.json").version')"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-release
