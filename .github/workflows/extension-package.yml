# Store uploads: builds the extension and packs one zip per store, since
# Chrome and Firefox need different manifests (extension/build.mjs), plus the
# source zip AMO asks for because the scripts are bundled and minified.
# Every run keeps them as a workflow artifact; a v* tag also attaches them to
# the GitHub release of that tag. Tag and release come from `npm run release`
# in extension/ (release.mjs); the tag must match "version" in
# extension/src/manifest.json.
name: Extension package

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'extension/**'
      - 'data/**'
      - '.github/workflows/extension-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p 'require("./extension/src/manifest.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, manifest version $v"; exit 1; }

      - name: Build, lint and pack
        working-directory: extension
        run: |
          npm ci
          npm run typecheck
          npm run package

      - name: Source zip for AMO
        run: |
          v=$(node -p 'require("./extension/src/manifest.json").version')
          git archive --format zip -o "extension/packages/source-$v.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: extension/packages/*.zip
          if-no-files-found: error

      # The release itself is created by extension/release.mjs under the
      # maintainer's account right after the tag push; CI only uploads to it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "no release $GITHUB_REF_NAME; run npm run release locally"; exit 1; }
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" extension/packages/*.zip --clobber
