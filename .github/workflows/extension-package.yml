# Store uploads: builds the extension and packs one zip per store, since
# Chrome and Firefox need different manifests (extension/build.mjs), plus the
# source zip AMO asks for because the scripts are bundled and minified.
# Every run keeps them as a workflow artifact.
#
# A push to master cuts a patch release first: `npm run release` in
# extension/ (release.mjs) bumps "version" in extension/src/manifest.json,
# rebuilds dist/, commits, tags v<version>, pushes and creates the GitHub
# release, and this run attaches the zips to it. A tag pushed with the
# workflow token starts no other workflow, so the upload has to happen here;
# for the same reason the bump commit does not trigger this workflow again.
# A "release v*" commit was cut locally with `npm run release`: it is not
# bumped again, and its own tag push runs this workflow to upload the zips.
name: Extension package

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'extension/**'
      - 'data/**'
      - '.github/workflows/extension-package.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUMP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'release v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p 'require("./extension/src/manifest.json").version')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, manifest version $v"; exit 1; }

      - name: Install and typecheck
        working-directory: extension
        run: |
          npm ci
          npm run typecheck

      - name: Bump version and release
        id: release
        if: env.BUMP == 'true'
        working-directory: extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'beta'
          git config user.email 'qwantone@gmail.com'
          npm run release
          echo "tag=v$(node -p 'require("./src/manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Build, lint and pack
        working-directory: extension
        run: npm run package

      - name: Source zip for AMO
        run: |
          v=$(node -p 'require("./extension/src/manifest.json").version')
          git archive --format zip -o "extension/packages/source-$v.zip" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: extension/packages/*.zip
          if-no-files-found: error

      # On a tag push the release was created by extension/release.mjs under
      # the maintainer's account right after the push; wait for it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag || github.ref_name }}
        run: |
          for i in $(seq 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "no release $TAG; run npm run release locally"; exit 1; }
            sleep 10
          done
          gh release upload "$TAG" extension/packages/*.zip --clobber
